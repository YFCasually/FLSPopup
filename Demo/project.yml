name: FLSPopupDemo
options:
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FLSPopup:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FLSPopupDemo:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.falins.FLSPopupDemo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
    dependencies:
      - package: FLSPopup
  FLSPopupDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.falins.FLSPopupDemoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FLSPopupDemo
    dependencies:
      - target: FLSPopupDemo
schemes:
  FLSPopupDemo:
    build:
      targets:
        FLSPopupDemo: all
    test:
      targets:
        - FLSPopupDemoUITests
